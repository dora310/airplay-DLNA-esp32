name: Build

# Reusable ESP32-S3 firmware build used by ci.yml and release.yml.
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: esp32s3
            target: esp32s3
            sdkconfig: "sdkconfig.defaults;sdkconfig.defaults.esp32s3"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Read firmware version
        id: firmware_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.txt must contain MAJOR.MINOR.PATCH, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          command: >
            rm -f sdkconfig sdkconfig.old &&
            rm -rf build &&
            idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3" build &&
            cp build/airplay2-receiver.bin
            airplay2-receiver-esp32s3-v${{ steps.firmware_version.outputs.version }}-ota.bin &&
            cd build &&
            esptool.py --chip esp32s3 merge_bin --format raw
            -o merged-firmware.bin $(cat flash_args) &&
            cp merged-firmware.bin
            ../airplay2-receiver-esp32s3-v${{ steps.firmware_version.outputs.version }}-install.bin

      - name: Upload ESP32-S3 firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-esp32s3
          path: |
            airplay2-receiver-esp32s3-v${{ steps.firmware_version.outputs.version }}-install.bin
            airplay2-receiver-esp32s3-v${{ steps.firmware_version.outputs.version }}-ota.bin
          if-no-files-found: error
          retention-days: 30
