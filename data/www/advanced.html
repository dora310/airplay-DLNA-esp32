<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirPlay Receiver Advanced</title><style>
body{font:16px system-ui;background:#15182b;color:#f4f5ff;max-width:850px;margin:auto;padding:24px}section{background:#24283f;border-radius:16px;padding:20px;margin:16px 0}button,input,select{font:inherit;padding:10px;margin:5px;border:0;border-radius:8px}button{background:#ef476f;color:white}input{background:#111426;color:white;min-width:240px}pre{white-space:pre-wrap;color:#b7efcf}.row{display:flex;gap:8px;flex-wrap:wrap}label{display:block;margin:8px 0}.muted{color:#aeb2c6}</style></head><body>
<h1>AirPlay Receiver <small>v0.3</small></h1><p><a href="/" style="color:#7ad7ff">← Basic settings</a></p>
<section><h2>API access</h2><label>API password <input id="key" type="password" placeholder="Only needed after protection is enabled"></label><button onclick="setPassword()">Set/change password</button><p class="muted">Minimum 8 characters. Stored as a SHA-256 digest.</p></section>
<section><h2>Playback</h2><div class="row"><button onclick="control('play_pause')">Play/Pause</button><button onclick="control('previous')">Previous</button><button onclick="control('next')">Next</button><button onclick="control('volume_down')">Volume −</button><button onclick="control('volume_up')">Volume +</button><button onclick="control('mute')">Mute</button></div></section>
<section><h2>Internet radio</h2><input id="radio" placeholder="https://station/stream.mp3"><button onclick="radio()">Play URL</button></section>
<section><h2>DSP</h2><label><input id="dspOn" type="checkbox"> Enable DSP</label><label><input id="limiter" type="checkbox" checked> Limiter</label><label><input id="normalization" type="checkbox"> Normalization</label><label>Balance −1…+1 <input id="balance" type="number" min="-1" max="1" step="0.05" value="0"></label><label>Channel <select id="channel"><option value="0">Stereo</option><option value="1">Mono</option><option value="2">Left</option><option value="3">Right</option><option value="4">Swap</option></select></label><label>Crossover <select id="cross"><option value="0">Off</option><option value="1">High-pass</option><option value="2">Low-pass</option></select> <input id="crossHz" type="number" value="80" min="30" max="18000"> Hz</label><button onclick="saveDSP()">Apply DSP</button></section>
<section><h2>Status and diagnostics</h2><button onclick="refresh()">Refresh</button><pre id="status">Loading…</pre></section>
<script>
key.value=localStorage.getItem('apiKey')||'';
const headers=()=>({'Content-Type':'application/json','X-API-Key':document.querySelector('#key').value||localStorage.getItem('apiKey')||''});
async function api(url,opt={}){opt.headers={...headers(),...(opt.headers||{})};let r=await fetch(url,opt);let t=await r.text();try{return JSON.parse(t)}catch{return {error:t,status:r.status}}}
async function control(action){await api('/api/v1/control',{method:'POST',body:JSON.stringify({action})});refresh()}
async function radio(){alert(JSON.stringify(await api('/api/v1/radio',{method:'POST',body:JSON.stringify({url:document.querySelector('#radio').value})})))}
async function setPassword(){let value=document.querySelector('#key').value;let result=await api('/api/v1/security/password',{method:'POST',body:JSON.stringify({password:value})});if(result.success)localStorage.setItem('apiKey',value);alert(JSON.stringify(result))}
async function saveDSP(){let current=await api('/api/v1/dsp');let body={...current,enabled:dspOn.checked,limiter:limiter.checked,normalization:normalization.checked,balance:+balance.value,channel:+channel.value,crossover:+cross.value,crossover_hz:+crossHz.value};delete body.success;alert(JSON.stringify(await api('/api/v1/dsp',{method:'POST',body:JSON.stringify(body)})))}
async function refresh(){let [s,h,d]=await Promise.all([api('/api/v1/status'),api('/api/v1/health'),api('/api/v1/dsp')]);status.textContent=JSON.stringify({status:s,health:h,dsp:d},null,2);if(d.success){dspOn.checked=d.enabled;limiter.checked=d.limiter;normalization.checked=d.normalization;balance.value=d.balance;channel.value=d.channel;cross.value=d.crossover;crossHz.value=d.crossover_hz}}
refresh();</script></body></html>
